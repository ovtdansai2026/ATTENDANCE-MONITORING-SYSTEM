  <script>
    // 1. Purge legacy service workers that cause stale caching on Home Screen standalone apps
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var reg of registrations) { reg.unregister(); }
      }).catch(function(){});
    }
    // 2. Global force update function for standalone Home Screen apps
    window.forceAppUpdate = function() {
      try {
        sessionStorage.clear();
        localStorage.removeItem('app_cached_students');
      } catch(e) {}
      var cleanUrl = window.location.origin + window.location.pathname + '?_t=' + Date.now();
      window.location.replace(cleanUrl);
    };
    // 3. Fully Automatic Silent Update Check (No teacher action required!)
    // When the app opens or resumes, it sends a tiny HEAD request to check ETag/Last-Modified.
    // If a newer version is deployed, it silently reloads to the latest build automatically.
    (function() {
      function checkAutoUpdate() {
        if (!navigator.onLine) return;
        fetch(window.location.pathname + '?_chk=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
          .then(function(res) {
            var etag = res.headers.get('ETag') || res.headers.get('Last-Modified');
            if (etag) {
              var lastEtag = localStorage.getItem('app_installed_etag');
              if (!lastEtag) {
                localStorage.setItem('app_installed_etag', etag);
              } else if (lastEtag !== etag) {
                localStorage.setItem('app_installed_etag', etag);
                localStorage.removeItem('app_cached_students');
                window.location.replace(window.location.origin + window.location.pathname + '?_v=' + Date.now());
              }
            }
          }).catch(function() {});
      }
      setTimeout(checkAutoUpdate, 1500);
      window.addEventListener('focus', checkAutoUpdate);
      document.addEventListener('visibilitychange', function() {
        if (document.visibilityState === 'visible') checkAutoUpdate();
      });
    })();
  </script>

function thaiToEngNums(str) {
  if (!str) return '';
  const thaiNums = ['๐','๑','๒','๓','๔','๕','๖','๗','๘','๙'];
  return String(str).replace(/[๐-๙]/g, ch => thaiNums.indexOf(ch));
}

function extractClassLevel(text) {
  if (!text) return 'ปวช.1';
  const converted = thaiToEngNums(String(text));
  const match = converted.match(/(ปวช\s*\.?\s*[1-3]|ปวส\s*\.?\s*[1-2])/i);
  if (match) {
    return match[0].replace(/\s+/g, '').replace('ปวช', 'ปวช.').replace('ปวส', 'ปวส.').replace(/\.\./g, '.');
  }
  return 'ปวช.1';
}

function getDeptFromStudentId(sid, deptCodes = DEFAULT_DEPT_CODES) {
  if (!sid) return 'ทั่วไป';
  const cleaned = String(sid).trim().replace(/\D/g, '');
  if (cleaned.length >= 7) {
    const code = cleaned.substring(2, 7);
    if (deptCodes[code]) return deptCodes[code];
  }
  return 'ทั่วไป';
}

// Clean & Normalize Vocational Department Names (รวมช่างไฟฟ้า/ช่างไฟฟ้ากำลัง, ป้องกันชื่อแผนกซ้ำซ้อน)
function normalizeDepartmentName(dept) {
  if (!dept) return 'ทั่วไป';
  let clean = String(dept).trim();
  // ตัดคำว่า "แผนกวิชา" หรือ "แผนก" นำหน้าออก เพื่อเก็บชื่อแกนกลางมาตรฐาน
  clean = clean.replace(/^(?:แผนกวิชา|แผนก)+/g, '').trim();

  // ช่างไฟฟ้ากำลัง (ครอบคลุม ช่างไฟฟ้า, ช่างไฟฟ้ากำลัง, ไฟฟ้ากำลัง, ไฟฟ้า)
  if (clean.includes('ไฟ')) return 'ช่างไฟฟ้ากำลัง';
  // ช่างยนต์ (ครอบคลุม ช่างยนต์, ยานยนต์, เครื่องกล)
  if (clean.includes('ยนต์') || clean.includes('ยานยนต์') || clean.includes('เครื่องกล')) return 'ช่างยนต์';
  // ช่างกลโรงงาน (ครอบคลุม ช่างกล, กลโรงงาน, เทคนิคการผลิต)
  if (clean.includes('ช่างกล') || clean.includes('กลโรงงาน') || clean.includes('เทคนิคการผลิต') || clean.includes('โรงงาน')) return 'ช่างกลโรงงาน';
  // ช่างอิเล็กทรอนิกส์
  if (clean.includes('อิเล็ก')) return 'ช่างอิเล็กทรอนิกส์';
  // การบัญชี
  if (clean.includes('บัญชี')) return 'การบัญชี';
  // การตลาด
  if (clean.includes('ตลาด')) return 'การตลาด';
  // อาหารและโภชนาการ
  if (clean.includes('อาหาร') || clean.includes('โภชนาการ')) return 'อาหารและโภชนาการ';
  // เทคโนโลยีธุรกิจดิจิทัล (ครอบคลุม เทคโนโลยีธุรกิจด, ธุรกิจดิจิทัล, คอมพิวเตอร์ธุรกิจ)
  if (clean.includes('ธุรกิจ') || clean.includes('ดิจิทัล') || clean.includes('คอมพิวเตอร์')) return 'เทคโนโลยีธุรกิจดิจิทัล';
  // การโรงแรม
  if (clean.includes('โรงแรม')) return 'การโรงแรม';
  // ช่างก่อสร้าง
  if (clean.includes('ก่อสร้าง')) return 'ช่างก่อสร้าง';
  // ช่างเชื่อมโลหะ
  if (clean.includes('เชื่อม')) return 'ช่างเชื่อมโลหะ';

  return clean || 'ทั่วไป';
}

// Clean & Normalize Teacher Names for reliable multi-room linking and comparison
function normalizeTeacherName(str) {
  if (!str) return '';
  return String(str)
    .replace(/[\u200B-\u200D\uFEFF\u00A0]/g, '')
    .replace(/^(นาย|นางสาว|นาง|ว่าที่ร\.ต\.|ว่าที่ ร\.ต\.|ว่าที่ร้อยตรี|อาจารย์|ครู|ผศ\.|รศ\.|ศ\.|ดร\.|อ\.|น\.ส\.|น\.ส)\s*/g, '')
    .replace(/\s+/g, '')
    .toLowerCase();
}

// Safe universal clipboard helper (Supports both HTTPS and HTTP LAN IP)
function safeCopyToClipboard(text) {
  return new Promise((resolve, reject) => {
    if (navigator.clipboard && typeof navigator.clipboard.writeText === 'function') {
      navigator.clipboard.writeText(text).then(resolve).catch(() => fallback());
      return;
    }
    fallback();

    function fallback() {
      try {
        const textArea = document.createElement('textarea');
        textArea.value = text;
        textArea.style.position = 'fixed';
        textArea.style.left = '-9999px';
        textArea.style.top = '-9999px';
        textArea.setAttribute('readonly', '');
        document.body.appendChild(textArea);
        textArea.select();
        textArea.setSelectionRange(0, 99999);
        const successful = document.execCommand('copy');
        document.body.removeChild(textArea);
        if (successful) {
          resolve();
        } else {
          reject(new Error('execCommand failed'));
        }
      } catch (err) {
        reject(err);
      }
    }
  });
}
window.safeCopyToClipboard = safeCopyToClipboard;

// Client-side Avatar compression (Auto square center-crop & WebP/JPEG compression ~15KB)
function compressAvatar(file, size = 180, quality = 0.75) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        canvas.width = size;
        canvas.height = size;
        const ctx = canvas.getContext('2d');
        const minDim = Math.min(img.width, img.height);
        const sx = (img.width - minDim) / 2;
        const sy = (img.height - minDim) / 2;
        ctx.drawImage(img, sx, sy, minDim, minDim, 0, 0, size, size);
        let dataUrl = canvas.toDataURL('image/webp', quality);
        if (!dataUrl || !dataUrl.startsWith('data:image/webp')) {
          dataUrl = canvas.toDataURL('image/jpeg', quality);
        }
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

function convertDrivePhotoUrl(url) {
  if (!url) return '';
  const trimmed = String(url).trim();
  const match = trimmed.match(/\/file\/d\/([a-zA-Z0-9_-]+)/) || trimmed.match(/id=([a-zA-Z0-9_-]+)/);
  if (match && match[1]) {
    return 'https://drive.google.com/thumbnail?id=' + match[1] + '&sz=w400';
  }
  return trimmed;
}

// Client-side image compression
function compressImage(file, maxWidth = 1200, maxHeight = 1200, quality = 0.7) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        let width = img.width;
        let height = img.height;
        if (width > maxWidth || height > maxHeight) {
          if (width > height) {
            height = Math.round((height * maxWidth) / width);
            width = maxWidth;
          } else {
            width = Math.round((width * maxHeight) / height);
            height = maxHeight;
          }
        }
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', quality);
        resolve(dataUrl);
      };
      img.onerror = reject;
      img.src = e.target.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

// Calendar Month Days Generator
function getMonthDays(year, month) {
  const firstDay = new Date(year, month, 1);
  const lastDay = new Date(year, month + 1, 0);
  const daysInMonth = lastDay.getDate();
  const startDayOfWeek = (firstDay.getDay() + 6) % 7; // Mon = 0, Sun = 6
  
  const days = [];
  for (let i = 0; i < startDayOfWeek; i++) {
    days.push({ day: null, dateStr: null, isWeekend: false });
  }
  for (let d = 1; d <= daysInMonth; d++) {
    const dateObj = new Date(year, month, d);
    const dayOfWeek = (dateObj.getDay() + 6) % 7;
    const isWeekend = dayOfWeek >= 5;
    const monthStr = String(month + 1).padStart(2, '0');
    const dayStr = String(d).padStart(2, '0');
    const dateStr = `${year}-${monthStr}-${dayStr}`;
    days.push({ day: d, dateStr, isWeekend });
  }
  return days;
}

// Safe Local Date Formatter (YYYY-MM-DD in user's local timezone)
function formatLocalDate(d) {
  d = d || new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

function getHolidayLabel(dateStr, customReasons = {}) {
  if (!dateStr) return "วันหยุด";
  if (customReasons && customReasons[dateStr] && String(customReasons[dateStr]).trim()) {
    return String(customReasons[dateStr]).trim();
  }
  return "วันหยุด";
}

function formatThaiDateFull(dateStr) {
  if (!dateStr) return '';
  const parts = String(dateStr).split('-');
  if (parts.length < 3) return dateStr;
  const y = parseInt(parts[0], 10);
  const m = parseInt(parts[1], 10);
  const d = parseInt(parts[2], 10);
  const mNames = ['ม.ค.', 'ก.พ.', 'มี.ค.', 'เม.ย.', 'พ.ค.', 'มิ.ย.', 'ก.ค.', 'ส.ค.', 'ก.ย.', 'ต.ค.', 'พ.ย.', 'ธ.ค.'];
  const dayNames = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
  const dateObj = new Date(y, m - 1, d);
  const dayName = isNaN(dateObj.getTime()) ? '' : dayNames[dateObj.getDay()];
  return `${dayName ? 'วัน' + dayName + 'ที่ ' : ''}${d} ${mNames[m - 1] || ''} ${y + 543}`;
}

// Dynamic School Days Calculator (ข้ามเสาร์-อาทิตย์, หักวันหยุดพิเศษ, รวมวันเรียนชดเชย)
function calculateSchoolDaysStats(startDateStr, endDateStr, specialHolidays = [], compensatoryDays = []) {
  if (!startDateStr) {
    return { elapsedDays: 65, totalTermDays: 65, isAuto: false };
  }

  const start = new Date(startDateStr + 'T00:00:00');
  if (isNaN(start.getTime())) {
    return { elapsedDays: 65, totalTermDays: 65, isAuto: false };
  }

  const todayStr = formatLocalDate(new Date());
  const today = new Date(todayStr + 'T00:00:00');

  let end;
  if (endDateStr) {
    end = new Date(endDateStr + 'T00:00:00');
  } else {
    end = new Date(start);
    end.setDate(end.getDate() + 19 * 7); // Default ~19 weeks
  }

  const holSet = new Set(specialHolidays || []);
  const compSet = new Set(compensatoryDays || []);

  let elapsed = 0;
  let totalTerm = 0;

  const cur = new Date(start);
  while (cur <= end) {
    const curStr = formatLocalDate(cur);
    const dayOfWeek = cur.getDay(); // 0 = Sun, 6 = Sat
    const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);

    let isSchoolDay = false;
    if (isWeekend) {
      if (compSet.has(curStr)) isSchoolDay = true; // Compensatory weekend
    } else {
      if (!holSet.has(curStr)) isSchoolDay = true; // Normal weekday not holiday
    }

    if (isSchoolDay) {
      totalTerm++;
      if (cur <= today) {
        elapsed++;
      }
    }
    cur.setDate(cur.getDate() + 1);
  }

  const isNotStarted = today < start;

  return {
    elapsedDays: isNotStarted ? 0 : Math.max(1, elapsed),
    totalTermDays: Math.max(1, totalTerm),
    isAuto: true,
    isNotStarted,
    todayStr
  };
}

// Helper to determine initial calendar date clamped within the relevant term
function getInitialCalendarDate(startDateStr, endDateStr) {
  const now = new Date();
  const todayStr = formatLocalDate(now);
  if (startDateStr && todayStr < startDateStr) {
    const parts = startDateStr.split('-').map(Number);
    if (parts.length === 3 && parts[0] > 2000) return new Date(parts[0], parts[1] - 1, 1);
  }
  if (endDateStr && todayStr > endDateStr) {
    const parts = endDateStr.split('-').map(Number);
    if (parts.length === 3 && parts[0] > 2000) return new Date(parts[0], parts[1] - 1, 1);
  }
  return now;
}

// Thai Date Formatter (e.g. "วันจันทร์ที่ 18 ตุลาคม 2569")
function formatThaiDateLong(date = new Date()) {
  const days = ['อาทิตย์', 'จันทร์', 'อังคาร', 'พุธ', 'พฤหัสบดี', 'ศุกร์', 'เสาร์'];
  const months = ['มกราคม', 'กุมภาพันธ์', 'มีนาคม', 'เมษายน', 'พฤษภาคม', 'มิถุนายน', 'กรกฎาคม', 'สิงหาคม', 'กันยายน', 'ตุลาคม', 'พฤศจิกายน', 'ธันวาคม'];
  const dayName = days[date.getDay()];
  const day = date.getDate();
  const monthName = months[date.getMonth()];
  const yearTh = date.getFullYear() + 543;
  return `วัน${dayName}ที่ ${day} ${monthName} ${yearTh}`;
}

// Time Window Checker for Teacher Check-in (07:35 - 08:20 น. on normal school days)
function getCheckinTimeStatus(specialHolidays = [], compensatoryDays = [], adminOverride = false) {
  if (adminOverride) {
    return {
      allowed: true,
      isAdminOverride: true,
      status: 'ADMIN_OVERRIDE',
      badgeColor: 'emerald',
      label: 'สิทธิ์แอดมิน (Admin Override)',
      subtext: 'ข้ามการตรวจสอบเวลาตามสิทธิ์ผู้ดูแลระบบ',
      currentTimeStr: new Date().toLocaleTimeString('th-TH', { hour: '2-digit', minute: '2-digit' })
    };
  }

  const now = new Date();
  const dayOfWeek = now.getDay(); // 0 = Sun, 1 = Mon, ..., 6 = Sat
  const dateStr = formatLocalDate(now);
  const curMinutes = now.getHours() * 60 + now.getMinutes();
  const startMinutes = 7 * 60 + 35; // 07:35 = 455
  const endMinutes = 8 * 60 + 20;   // 08:20 = 500

  const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
  const isCompensatory = (compensatoryDays || []).includes(dateStr);
  const isHoliday = (specialHolidays || []).includes(dateStr);
  const isSchoolDay = (!isWeekend || isCompensatory) && !isHoliday;

  const timeFormatted = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')} น.`;

  if (!isSchoolDay) {
    return {
      allowed: false,
      status: 'HOLIDAY',
      badgeColor: 'slate',
      label: 'วันหยุด (ปิดรับเช็คชื่อ)',
      subtext: isHoliday ? 'วันนี้เป็นวันหยุดพิเศษตามปฏิทินวิทยาลัย' : 'วันนี้เป็นวันเสาร์ - อาทิตย์ (เปิดเฉพาะวันเรียนปกติ)',
      isSchoolDay: false,
      currentTimeStr: timeFormatted
    };
  }

  if (curMinutes < startMinutes) {
    const diff = startMinutes - curMinutes;
    return {
      allowed: false,
      status: 'TOO_EARLY',
      badgeColor: 'amber',
      label: 'ยังไม่ถึงเวลาเช็คชื่อ',
      subtext: `เปิดระบบช่วง 07:35 - 08:20 น. (อีกประมาณ ${diff} นาที)`,
      isSchoolDay: true,
      currentTimeStr: timeFormatted
    };
  }

  if (curMinutes > endMinutes) {
    return {
      allowed: false,
      status: 'CLOSED',
      badgeColor: 'slate',
      label: 'หมดเวลาเช็คชื่อแล้ว',
      subtext: 'ระบบตัดรอบเวลา 08:20 น. (เปิด 07:35 - 08:20 น.)',
      isSchoolDay: true,
      currentTimeStr: timeFormatted
    };
  }

  const remaining = endMinutes - curMinutes;
  return {
    allowed: true,
    status: 'OPEN',
    badgeColor: 'emerald',
    label: 'เปิดรับเช็คชื่อ',
    subtext: `เปิดถึง 08:20 น. (เหลือเวลาอีก ${remaining} นาที)`,
    isSchoolDay: true,
    currentTimeStr: timeFormatted
  };
}

// Generator for Daily LINE Attendance Report (Text + Flex Message)

  semester = '1',
  customNote = '',
  dashboardUrl = 'https://attendance-dashboard.vercel.app',
  forceMock = false
}) {
  const today = new Date();
  const todayStr = formatLocalDate(today);
  const dateFormatted = formatThaiDateLong(today);

  // Filter sessions for today
  const todaySessions = (sessions || []).filter(s => 
    s.check_date === todayStr &&
    String(s.academic_year || academicYear) === String(academicYear) &&
    String(s.semester || semester) === String(semester)
  );

  // Dynamically determine active departments from active students in college, fallback to CANONICAL_DEPTS
  const activeDepts = Array.from(new Set(
    (masterStudents && masterStudents.length > 0)
      ? masterStudents.map(s => normalizeDepartmentName(s.dept || s.department)).filter(Boolean)
      : CANONICAL_DEPTS
  )).filter(d => d && d !== 'ทั่วไป').sort((a, b) => a.localeCompare(b, 'th'));

  // Group master students by department
  const deptStudentMap = {};
  activeDepts.forEach(d => { deptStudentMap[d] = []; });
  (masterStudents || []).forEach(s => {
    const norm = normalizeDepartmentName(s.dept || s.department);
    if (!deptStudentMap[norm]) deptStudentMap[norm] = [];
    deptStudentMap[norm].push(s);
  });

  const hasAnyTodaySession = todaySessions.length > 0;
  const useSimulatedData = Boolean(forceMock);

    'การโรงแรม': { p: 16, a: 2, l: 0 }
  };

  const deptList = activeDepts.map(deptName => {
    const studentsInDept = deptStudentMap[deptName] || [];
    const totalDeptStudents = studentsInDept.length || 0;

    if (useSimulatedData) {
      const mock = mockDeptStats[deptName] || { p: 18, a: 2, l: 0 };
      const tot = totalDeptStudents > 0 ? totalDeptStudents : 20;
      const p = Math.min(tot, mock.p);
      const a = mock.a;
      const l = mock.l;
      const pct = tot > 0 ? Math.round((p / tot) * 100) : 0;
      return {
        name: deptName,
        total: tot,
        present: p,
        absent: a,
        leave: l,
        percent: pct,

        teacherName: 'ครูประจำแผนก'

async function fetchAllRows(client, tableName, select = '*') {
  let allRows = [];
  let from = 0;
  const step = 1000;
  while (true) {
    const to = from + step - 1;
    const { data, error } = await client.from(tableName).select(select).range(from, to);
    if (error) throw error;
    if (!data || data.length === 0) break;
    allRows.push(...data);
    if (data.length < step) break;
    from += step;
  }
  return allRows;
}

  // LINE Auto-send at 08:20 Cut-off on School Days (Excluding Weekends & Special Holidays)
  useEffect(() => {
    if (!lineSettings?.autoSendOnCutoff || !lineSettings?.channelAccessToken || !lineSettings?.destinationId) return;

    const checkAndSendCutoffReport = async () => {
      const now = new Date();
      const todayStr = formatLocalDate(now);
      const dayOfWeek = now.getDay();

      // Check School Day vs Holiday using the EXACT same criteria as teacher check-in
      const isWeekend = (dayOfWeek === 0 || dayOfWeek === 6);
      const isCompensatory = (compensatoryDays || []).includes(todayStr);
      const isHoliday = (specialHolidays || []).includes(todayStr);
      const isSchoolDay = (!isWeekend || isCompensatory) && !isHoliday;

      // Do NOT send on holidays or weekends
      if (!isSchoolDay) return;

      // Check if current time is within cutoff window (08:20 - 09:30 น.)
      const curHour = now.getHours();
      const curMin = now.getMinutes();
      const isCutoffTime = (curHour === 8 && curMin >= 20) || (curHour > 8 && curHour <= 9);

      if (!isCutoffTime) return;

      // Check if already sent today to prevent duplicate sending
      const lastSentDate = localStorage.getItem('line_last_autosent_date');
      if (lastSentDate === todayStr) return;

      // Mark as sent immediately to avoid race conditions
      localStorage.setItem('line_last_autosent_date', todayStr);

      try {
        const report = generateDailyLineReport({
          masterStudents: activeMasterStudents,
          sessions: displayCheckinSessions,
          dailyAttendance: displayDailyAttendance,
          academicYear: currentAcademicYear,
          semester: currentSemester,
          customNote: lineSettings.customNote,
          dashboardUrl: lineSettings.dashboardUrl,
          forceMock: false
        });

        const res = await fetch('/api/line-notify', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            channelAccessToken: lineSettings.channelAccessToken.trim(),
            destinationId: lineSettings.destinationId.trim(),
            flexMessage: report.flexMessage,
            textMessage: report.textMessage,
            altText: `สรุปยอดการเข้าแถว วก.ด่านซ้าย ประจำ${report.dateFormatted}`
          })
        });
        const json = await res.json().catch(() => ({}));
        if (res.ok && json.success) {
          console.log('✅ ส่งรายงานอัตโนมัติ 08:20 น. เข้า LINE เรียบร้อยแล้ว');
        } else {
          console.warn('⚠️ ส่งรายงานอัตโนมัติ 08:20 น. ล้มเหลว:', json.error || res.status);
        }
      } catch (err) {
        console.error('Error auto-sending 08:20 LINE report:', err);
      }
    };

    const intervalTimer = setInterval(checkAndSendCutoffReport, 30000);
    checkAndSendCutoffReport();
    return () => clearInterval(intervalTimer);
  }, [lineSettings, specialHolidays, compensatoryDays, masterStudents, checkinSessions, currentAcademicYear, currentSemester]);

    try {
      const [sessionsRes, photoIdsRes] = await Promise.all([

        } catch(_) {}
      }
    } catch (e) {
      console.warn('Sessions query fallback:', e);
    }
  }, []);

  // Fetch Teachers (ไม่ดึง pin_hash เข้า Client เด็ดขาดเพื่อความปลอดภัย)
  const fetchTeachers = useCallback(async () => {
    try {
      const { data, error } = await dbAssembly.from('teachers')
        .select('id, name, department, class_level, phone, academic_year, semester')
        .order('id', { ascending: true });
      if (!error && data && data.length > 0) {
        setTeachersList(data);
      } else {
        setTeachersList(INITIAL_TEACHERS);
      }
    } catch (e) {
      console.warn('Teacher table fallback:', e);
      setTeachersList(INITIAL_TEACHERS);
    }
  }, []);

  // Fetch Assembly Data (Fast Teacher-Scoped loading for morning flagpole)
  const fetchAssemblyData = useCallback(async (forceAll = false) => {
    setIsLoading(true);
    try {
      const currentTeacher = loggedInTeacher || (() => {
        try { return JSON.parse(localStorage.getItem('logged_in_teacher') || sessionStorage.getItem('logged_in_teacher')); } catch(_) { return null; }
      })();
      const isClassroom = (dashboardViewMode === 'classroom' || !dashboardViewMode);
      const shouldScopeToTeacher = !forceAll && Boolean(currentTeacher) && isClassroom;

      let targetDepts = [];
      if (shouldScopeToTeacher && currentTeacher) {
        const normName = normalizeTeacherName(currentTeacher.name);
        const matching = (teachersList || []).filter(t => normalizeTeacherName(t.name) === normName);
        const deptsSet = new Set();
        const addDeptVariants = (d) => {
          if (!d) return;
          deptsSet.add(d);
          const norm = normalizeDepartmentName(d);
          if (norm) {
            deptsSet.add(norm);
            deptsSet.add('แผนก' + norm);
            deptsSet.add('แผนกวิชา' + norm);
          }
        };
        addDeptVariants(currentTeacher.department);
        matching.forEach(t => addDeptVariants(t.department));
        targetDepts = Array.from(deptsSet).filter(Boolean);
        isTeacherScopedDataRef.current = true;
      } else {
        isTeacherScopedDataRef.current = false;
      }

      const activeSemCheck = currentSemester || '2';
      const isSem2 = String(activeSemCheck) === '2';

      const [
        settingsRes,
        studentsRaw,
        rulesRes,
        centralActsRes,
        recheckStudentsRes,
        recheckAttsRes,
        assemblyAttsRes,
        sessionsRes,
        dailyAttsRes
      ] = await Promise.all([
        (async () => {
          try {
            return await dbAssembly.from('system_settings').select('*');
          } catch (_) {
            return { data: null };
          }
        })(),
        (shouldScopeToTeacher && targetDepts.length > 0)
          ? dbAssembly.from('attendance_summary').select('*').in('department', targetDepts).then(r => r.data || []).catch(() => [])
          : fetchAllRows(dbAssembly, 'attendance_summary', '*').catch(() => []),
        (async () => {
          try {
            return await dbAssembly.from('system_rules').select('*').order('min_percent', { ascending: false });
          } catch (_) {
            return { data: null };
          }
        })(),
        fetchAllRows(dbAssembly, 'activities', '*').catch(() => []),
        (!isSem2 ? fetchAllRows(dbReCheckFallback, 'students', '*').catch(() => []) : Promise.resolve([])),
        (!isSem2 ? fetchAllRows(dbReCheckFallback, 'attendances', '*').catch(() => []) : Promise.resolve([])),
        fetchAllRows(dbAssembly, 'attendances', '*').catch(() => []),
        fetchAllRows(dbAssembly, 'attendance_checkin_sessions', 'id, check_date, teacher_name, department, class_level, total_students, present_count, absent_count, leave_count, academic_year, semester, notes, created_at, updated_at').catch(() => []),
        (shouldScopeToTeacher && targetDepts.length > 0)
          ? dbAssembly.from('daily_attendance').select('*').in('department', targetDepts).then(r => r.data || []).catch(() => [])
          : fetchAllRows(dbAssembly, 'daily_attendance', '*').catch(() => [])
      ]);
      const rulesData = rulesRes?.data;
      if (rulesData && rulesData.length > 0) setRules(rulesData);
      
      let currentDays = 65;
      let curStart = termStartDate;
      let curEnd = termEndDate;
      let curHols = specialHolidays;
      let curComp = compensatoryDays;
      let activeYear = currentAcademicYear || '2569';
      let activeSem = currentSemester || '2';
      let loadedSchedules = {};

      const settings = settingsRes?.data;
      if (settings) {
        const updatedObj = settings.find(s => s.key === 'last_updated');
        const totalDaysObj = settings.find(s => s.key === 'base_total_days');
        const yearObj = settings.find(s => s.key === 'current_academic_year');
        const semObj = settings.find(s => s.key === 'current_semester');
        const startObj = settings.find(s => s.key === 'term_start_date');
        const endObj = settings.find(s => s.key === 'term_end_date');
        const holObj = settings.find(s => s.key === 'special_holidays');
        const holReasonsObj = settings.find(s => s.key === 'holiday_reasons');
        const compObj = settings.find(s => s.key === 'compensatory_days');

        if (updatedObj?.value) setLastUpdated(`เข้าแถวอัปเดต: ${updatedObj.value}`);
        else setLastUpdated('เชื่อมต่อ Supabase สำเร็จ');
        if (yearObj?.value) {
          activeYear = yearObj.value;
          localStorage.setItem('app_academic_year', yearObj.value);
          setCurrentAcademicYear(prev => prev === yearObj.value ? prev : yearObj.value);
        }
        if (semObj?.value) {
          activeSem = semObj.value;
          localStorage.setItem('app_semester', semObj.value);
          setCurrentSemester(prev => prev === semObj.value ? prev : semObj.value);
        }

        const schedObj = settings.find(s => s.key === 'term_schedules_map');
        if (schedObj?.value) {
          try {
            const parsed = JSON.parse(schedObj.value);
            if (parsed && typeof parsed === 'object') {
              loadedSchedules = parsed;
              setTermSchedules(prev => JSON.stringify(prev) === JSON.stringify(parsed) ? prev : parsed);
            }
          } catch(e){}
        }

        if (startObj?.value) {
          curStart = startObj.value;
          localStorage.setItem('app_term_start_date', startObj.value);
          setTermStartDate(prev => prev === startObj.value ? prev : startObj.value);
        }
        if (endObj?.value) {
          curEnd = endObj.value;
          localStorage.setItem('app_term_end_date', endObj.value);
          setTermEndDate(prev => prev === endObj.value ? prev : endObj.value);
        }
        if (holObj?.value) {
          try {
            const p = JSON.parse(holObj.value);
            if (Array.isArray(p)) {
              curHols = p;
              setSpecialHolidays(prev => JSON.stringify(prev) === JSON.stringify(p) ? prev : p);
            }
          } catch(e){}
        }
        if (holReasonsObj?.value) {
          try {
            const p = JSON.parse(holReasonsObj.value);
            if (p && typeof p === 'object') {
              setHolidayReasons(prev => JSON.stringify(prev) === JSON.stringify(p) ? prev : p);
            }
          } catch(e){}
        }
        if (compObj?.value) {
          try {
            const p = JSON.parse(compObj.value);
            if (Array.isArray(p)) {
              curComp = p;
              setCompensatoryDays(prev => JSON.stringify(prev) === JSON.stringify(p) ? prev : p);
            }
          } catch(e){}
        }

        if (totalDaysObj?.value) {
          const parsed = parseInt(totalDaysObj.value, 10);
          if (!isNaN(parsed) && parsed > 0) {
            currentDays = parsed;
          }
        }
        
        const calModeObj = settings.find(s => s.key === 'enable_calendar_mode');
        const calEnabled = calModeObj ? calModeObj.value === 'true' : false;
        setIsCalendarEnabled(calEnabled);

        const hiddenLevelsObj = settings.find(s => s.key === 'hidden_class_levels');
        if (hiddenLevelsObj?.value) {
          try {
            const p = JSON.parse(hiddenLevelsObj.value);
            if (Array.isArray(p)) {
              setHiddenClassLevels(prev => JSON.stringify(prev) === JSON.stringify(p) ? prev : p);
            }
          } catch(e){}
        }

        const availYearsObj = settings.find(s => s.key === 'available_academic_years');
        if (availYearsObj?.value) {
          try {
            const parsed = JSON.parse(availYearsObj.value);
            if (Array.isArray(parsed) && parsed.length > 0) {
              setAvailableAcademicYears(prev => JSON.stringify(prev) === JSON.stringify(parsed) ? prev : parsed);
            }
          } catch (e) {}
        }

        const driveWebhookObj = settings.find(s => s.key === 'google_drive_webhook_url');
        if (driveWebhookObj?.value) {
          try {
            localStorage.setItem('google_drive_webhook_url', driveWebhookObj.value);
          } catch(_) {}
        }

        const photosObj = settings.find(s => s.key === 'student_photos_map');
        if (photosObj?.value) {
          try {
            const parsed = typeof photosObj.value === 'object' ? photosObj.value : JSON.parse(photosObj.value);
            if (parsed && typeof parsed === 'object') {
              let localCached = {};
              try {
                const c = localStorage.getItem('student_photos_cache');
                if (c) localCached = JSON.parse(c) || {};
              } catch(_) {}
              const merged = { ...localCached, ...parsed };
              setStudentPhotosMap(prev => JSON.stringify(prev) === JSON.stringify(merged) ? prev : merged);
              localStorage.setItem('student_photos_cache', JSON.stringify(merged));
              const localKeys = Object.keys(localCached);
              const dbKeys = new Set(Object.keys(parsed));
              const adminToken = sessionStorage.getItem('admin_session_token');
              if (adminToken && localKeys.some(k => !dbKeys.has(k) && localCached[k])) {
                dbAssembly.rpc('admin_save_system_settings_batch_secure', {
                  p_settings: [{ key: 'student_photos_map', value: JSON.stringify(merged) }],
                  p_auth_token_or_pin: adminToken
                }).catch(err => console.warn('Sync student photos warning:', err));
              }
            }
          } catch(e) {}
        }

        const codesObj = settings.find(s => s.key === 'student_codes_map');
        if (codesObj?.value) {
          try {
            const parsed = typeof codesObj.value === 'object' ? codesObj.value : JSON.parse(codesObj.value);
            if (parsed && typeof parsed === 'object') {
              let localCached = {};
              try {
                const c = localStorage.getItem('student_codes_cache');
                if (c) localCached = JSON.parse(c) || {};
              } catch(_) {}
              const merged = { ...localCached, ...parsed };
              setStudentCodesMap(prev => JSON.stringify(prev) === JSON.stringify(merged) ? prev : merged);
              localStorage.setItem('student_codes_cache', JSON.stringify(merged));
            }
          } catch(e) {}
        }

        const teacherPhotosObj = settings.find(s => s.key === 'teacher_photos_map');
        if (teacherPhotosObj?.value) {
          try {
            const parsed = typeof teacherPhotosObj.value === 'object' ? teacherPhotosObj.value : JSON.parse(teacherPhotosObj.value);
            if (parsed && typeof parsed === 'object') {
              let localCached = {};
              try {
                const c = localStorage.getItem('teacher_photos_cache');
                if (c) localCached = JSON.parse(c) || {};
              } catch(_) {}
              const merged = { ...localCached, ...parsed };
              setTeacherPhotosMap(prev => JSON.stringify(prev) === JSON.stringify(merged) ? prev : merged);
              localStorage.setItem('teacher_photos_cache', JSON.stringify(merged));
              const localKeys = Object.keys(localCached);
              const dbKeys = new Set(Object.keys(parsed));
              const adminToken = sessionStorage.getItem('admin_session_token');
              if (adminToken && localKeys.some(k => !dbKeys.has(k) && localCached[k])) {
                dbAssembly.rpc('admin_save_system_settings_batch_secure', {
                  p_settings: [{ key: 'teacher_photos_map', value: JSON.stringify(merged) }],
                  p_auth_token_or_pin: adminToken
                }).catch(err => console.warn('Sync teacher photos warning:', err));
              }
            }
          } catch(e) {}
        }

        const offHoursObj = settings.find(s => s.key === 'allow_off_hours_checkin');
        if (offHoursObj) {
          const val = offHoursObj.value === 'true';
          setAllowOffHoursCheckin(val);
          localStorage.setItem('allow_off_hours_checkin', String(val));
        }

        const sandboxObj = settings.find(s => s.key === 'system_sandbox_mode');
        if (sandboxObj) {
          const val = sandboxObj.value === 'true';
          setIsSandboxMode(val);
          localStorage.setItem('system_sandbox_mode', String(val));
        }

        let loadedOpenIds = null;

        // 1. อ่านสถานะกิจกรรมกลางจากตาราง attendance_checkin_sessions ตามปีการศึกษาและภาคเรียนที่เลือก
        let sysSession = (sessionsRes || []).find(s => 
          s.department === '__SYSTEM_SETTINGS__' && 
          s.class_level === '__CENTRAL_ACTIVITIES__' &&
          String(s.academic_year || activeYear) === String(activeYear) &&
          String(s.semester || activeSem) === String(activeSem)
        );
        if (!sysSession && String(activeSem) === '1') {
          sysSession = (sessionsRes || []).find(s => 
            s.department === '__SYSTEM_SETTINGS__' && 
            s.class_level === '__CENTRAL_ACTIVITIES__'
          );
        }
        if (sysSession?.notes) {
          try {
            const p = JSON.parse(sysSession.notes);
            if (Array.isArray(p)) loadedOpenIds = p;
          } catch(e) {}
        }

        // 2. Fallback อ่านจาก system_settings (สำหรับเทอม 1 เท่านั้น)
        if (!Array.isArray(loadedOpenIds) && settings && String(activeSem) === '1') {
          const openActsObj = settings.find(s => s.key === 'open_central_activities');
          const testAuditObj = settings.find(s => s.key === 'test_audit_verified');
          const lineSettingsObj = settings.find(s => s.key === 'line_notification_settings');
          if (openActsObj?.value) {
            try { const p = JSON.parse(openActsObj.value); if (Array.isArray(p)) loadedOpenIds = p; } catch(e) {}
          }
          if (!Array.isArray(loadedOpenIds) && testAuditObj?.value) {
            try { const p = JSON.parse(testAuditObj.value); if (Array.isArray(p)) loadedOpenIds = p; } catch(e) {}
          }
          if (!Array.isArray(loadedOpenIds) && lineSettingsObj?.value) {
            try { const p = JSON.parse(lineSettingsObj.value); if (Array.isArray(p?.open_central_activities)) loadedOpenIds = p.open_central_activities; } catch(e) {}
          }
        }

        if (Array.isArray(loadedOpenIds)) {
          setOpenCentralActivityIds(loadedOpenIds);
          localStorage.setItem('open_central_activities', JSON.stringify(loadedOpenIds));
        } else {
          setOpenCentralActivityIds([]);
          localStorage.removeItem('open_central_activities');
        }

        const lineObj = settings.find(s => s.key === 'line_notification_settings');
        if (lineObj?.value) {
          try {
            const parsed = typeof lineObj.value === 'object' ? lineObj.value : JSON.parse(lineObj.value);
            if (parsed && typeof parsed === 'object') {
              setLineSettings(prev => JSON.stringify(prev) === JSON.stringify(parsed) ? prev : parsed);
              localStorage.setItem('line_notification_settings', JSON.stringify(parsed));
              if (!offHoursObj && parsed.allowOffHoursCheckin !== undefined) {
                setAllowOffHoursCheckin(Boolean(parsed.allowOffHoursCheckin));
              }
            }
          } catch(e) {}
        }
      }

      const currentTermKey = `${activeYear}_${activeSem}`;
      const activeTermSched = loadedSchedules[currentTermKey];
      
      // ดึงวันเปิด-ปิดภาคเรียนตามเทอมที่กำลังแสดงผล (เช่น สลับมาดูเทอม 2 ให้ใช้วันเปิด-ปิดของ 2569_2)
      if (activeTermSched?.startDate) {
        curStart = activeTermSched.startDate;
        curEnd = activeTermSched.endDate || curEnd;
      }

      // Calculate dynamic school days for active term
      const daysStats = calculateSchoolDaysStats(curStart, curEnd, curHols, curComp);
      let effectiveDays = currentDays;

      // ตรวจสอบว่าเปิดใช้ระบบปฏิทินหรือไม่ (ถ้าปิด ให้ใช้เกณฑ์วันคงที่ทันที ตัดปัญหาเรื่องวันหยุด)
      const isCalActive = settings ? (settings.find(s => s.key === 'enable_calendar_mode')?.value === 'true') : false;
      if (!isCalActive) {
        effectiveDays = (activeTermSched?.fixedDays && Number(activeTermSched.fixedDays) > 0)
          ? Number(activeTermSched.fixedDays)
          : currentDays;
        daysStats.isAuto = false;
        daysStats.isFixed = true;
        daysStats.totalTermDays = effectiveDays;
        daysStats.elapsedDays = daysStats.isNotStarted ? 0 : effectiveDays;
      } else {
        effectiveDays = daysStats.isAuto ? daysStats.elapsedDays : currentDays;
      }

      setCalendarStats(daysStats);
      setBaseTotalDays(effectiveDays);

      // ซิงค์ประวัติการเช็คชื่อเข้าปฏิทินทันที พร้อมบันทึกแคชลงเบราว์เซอร์
      if (sessionsRes && sessionsRes.length > 0) {
        const realSessions = sessionsRes.filter(s => s.department !== '__SYSTEM_SETTINGS__' && !String(s.department || '').startsWith('__'));
        if (realSessions.length > 0) {
          setCheckinSessions(prev => {
            const photoMap = new Map((prev || []).map(p => [p.id, p.has_photo]));
            return realSessions.map(s => ({
              ...s,
              has_photo: photoMap.get(s.id) || Boolean(s.evidence_photo_url)
            }));
          });
          try {
            localStorage.setItem('app_cached_checkin_sessions', JSON.stringify(realSessions));
          } catch(_) {}
        }
      }

      // 🎯 AUTO TERM ROSTER: ดึงรายชื่อนักศึกษาแยกตามเทอม
      let termStudents = [];
      if (String(activeSem) === '2') {
        // 1. ดึงนักเรียนที่มีข้อมูลในเทอม 2 อยู่แล้ว (รวมถึง ปวช.3 ที่เพิ่งเพิ่ม หรือที่มีการเช็คชื่อแล้ว)
        const sem2Explicit = (studentsRaw || []).filter(s => 
          String(s.academic_year) === String(activeYear) && String(s.semester) === '2'
        );
        const sem2Names = new Set(sem2Explicit.map(s => (s.student_name || '').trim()));

        // 2. ดึงรายชื่อเดิมจากเทอม 1 ของปีนี้ (เฉพาะคนที่ยังไม่มีเรคคอร์ดในเทอม 2)
        const sem1Base = (studentsRaw || []).filter(s => 
          (String(s.academic_year) === String(activeYear) || !s.academic_year) && 
          String(s.semester || '1') === '1'
        );

        // 3. รวมรายชื่อเดิมเข้าสู่เทอม 2 โดยตั้งวันเข้าแถวเริ่มต้นที่ 0 วัน
        const inherited = sem1Base
          .filter(s => !sem2Names.has((s.student_name || '').trim()))
          .map(s => ({
            ...s,
            present_days: 0,
            total_days: 0,
            percent: 0,
            academic_year: activeYear,
            semester: '2',
            _inherited: true
          }));

        termStudents = [...sem2Explicit, ...inherited];
      } else {
        // เทอม 1: ดึงเฉพาะนักเรียนเทอม 1 หรือข้อมูลตั้งต้น
        termStudents = (studentsRaw || []).filter(s => {
          if (s.academic_year && s.semester) {
            return String(s.academic_year) === String(activeYear) && String(s.semester) === '1';
          }
          return !s.academic_year || String(s.academic_year) === String(activeYear);
        });
      }
      
      // 1. Central Activities Lookup & Total (แยกตามปีการศึกษาและภาคเรียน 100%)
      const termActs = (centralActsRes || []).filter(a => 
        String(a.academic_year || activeYear) === String(activeYear) && 
        String(a.semester || activeSem) === String(activeSem)
      );
      const totalCentralActs = termActs.length;
      setActivities(prev => JSON.stringify(prev) === JSON.stringify(termActs) ? prev : termActs);

      const reStudentMap = {};
      (recheckStudentsRes || []).forEach(s => {
        if (s.id) reStudentMap[String(s.id).trim()] = s.id;
        if (s.student_id) reStudentMap[String(s.student_id).trim()] = s.id;
        if (s.full_name) {
          const raw = s.full_name.trim().replace(/\s+/g, ' ');
          reStudentMap[raw] = s.id;
          const stripped = raw.replace(/^(?:นาย|นางสาว|นาง|ด\.ช\.|ด\.ญ\.)\s*/g, '');
          reStudentMap[stripped] = s.id;
        }
      });

      const centralAttMap = {};
      const addAtt = (sid, actId) => {
        const sKey = String(sid || '').trim();
        const aKey = String(actId || '').trim().toLowerCase();
        if (sKey && aKey) {
          if (!centralAttMap[sKey]) centralAttMap[sKey] = new Set();
          centralAttMap[sKey].add(aKey);
        }
      };

      const termActIdSet = new Set(termActs.map(a => String(a.id || '').trim().toLowerCase()));

      // 1. ประวัติการเช็คชื่อเดิมจากตาราง Fallback (ใช้เฉพาะเทอม 1/2569 เท่านั้น จะไม่ข้ามมาเทอม 2)
      if (String(activeYear) === '2569' && String(activeSem) === '1') {
        (recheckAttsRes || []).forEach(a => {
          const aId = String(a.activity_id || '').trim().toLowerCase();
          if (termActIdSet.has(aId)) {
            addAtt(a.student_id, aId);
          }
        });
      }

      // 2. ข้อมูลการเช็คชื่อจากฐานข้อมูลหลัก: นับเฉพาะกิจกรรมที่เป็นของเทอมที่กำลังเปิดดูเท่านั้น
      (assemblyAttsRes || []).forEach(a => {
        const aId = String(a.activity_id || '').trim().toLowerCase();
        if (termActIdSet.has(aId)) {
          addAtt(a.student_id, aId);
        }
      });

      // 2. Club Sessions Lookup (Pre-normalized and deduplicated per session number)
      const rawClubSessions = (sessionsRes || []).filter(s => {
        let isClub = (s.activity_type === 'club' || s.session_type === 'club');
        if (!isClub && String(s.class_level || '').includes('#club_')) isClub = true;
        if (!isClub && s.notes) {
          try {
            const p = JSON.parse(s.notes);
            if (p.activity_type === 'club') isClub = true;
          } catch(_) {}
        }
        return isClub &&
          String(s.academic_year || activeYear) === String(activeYear) &&
          String(s.semester || activeSem) === String(activeSem);
      });

      const clubSessionsMap = new Map();
      rawClubSessions.forEach(cs => {
        let parsedNotes = {};
        if (cs.notes) {
          try { parsedNotes = JSON.parse(cs.notes); } catch(_) {}
        }
        const rawLvl = String(cs.class_level || '').split('#')[0].trim();
        const normDept = normalizeDepartmentName(cs.department);
        const sessNo = parsedNotes.session_number || (String(cs.class_level || '').match(/#club_(\d+)/)?.[1]) || 1;
        const dedupKey = `${normDept}_${rawLvl}_${sessNo}`;
        
        if (!clubSessionsMap.has(dedupKey) || new Date(cs.created_at || cs.check_date) > new Date(clubSessionsMap.get(dedupKey).created_at || clubSessionsMap.get(dedupKey).check_date)) {
          clubSessionsMap.set(dedupKey, {
            ...cs,
            normDept,
            cLvl: rawLvl,
            sessNo,
            presentStudentIds: Array.isArray(parsedNotes.present_student_ids) ? parsedNotes.present_student_ids.map(id => String(id).trim()) : null
          });
        }
      });
      const clubSessions = Array.from(clubSessionsMap.values());

      // Map daily attendance for active term (real-time calculation from daily_attendance)
      const dailyAttsList = dailyAttsRes || [];
      setDailyAttendanceRecords(dailyAttsList);
      const studentDailyPresentCount = {};
      dailyAttsList.forEach(row => {
        if (String(row.academic_year || activeYear) === String(activeYear) &&
            String(row.semester || activeSem) === String(activeSem) &&
            row.status === 'present') {
          const sId = String(row.student_id || '').trim();
          const sName = String(row.student_name || '').trim();
          if (sId) {
            studentDailyPresentCount[sId] = (studentDailyPresentCount[sId] || 0) + 1;
          }
          if (sName) {
            studentDailyPresentCount[sName] = (studentDailyPresentCount[sName] || 0) + 1;
          }
        }
      });

      const mapped = termStudents.map(s => {
        const dailyPresent = studentDailyPresentCount[String(s.id)] || 
                             studentDailyPresentCount[String(s.student_id)] || 
                             studentDailyPresentCount[(s.student_name || '').trim()] || 0;
        const rawPresent = parseInt(s.present_days, 10) || 0;
        const rawTotal = parseInt(s.total_days, 10) || 0;
        const computedPresent = Math.max(rawPresent, dailyPresent);
        // Term start status is strictly determined by whether today is before term start date (daysStats.isNotStarted)
        const isTermNotStarted = Boolean(daysStats.isNotStarted);
        const total = isTermNotStarted ? 0 : effectiveDays;
        const present = isTermNotStarted ? 0 : Math.min(total, computedPresent);
        const isGraduated = s.pure_level === 'สำเร็จการศึกษา';
        const pct = (isGraduated || isTermNotStarted) ? 100 : (total > 0 ? Math.min(100, Math.round((present / total) * 100)) : 0);

        // Real Central Activities Data
        const cleanName = (s.student_name || '').trim().replace(/\s+/g, ' ');
        const strippedName = cleanName.replace(/^(?:นาย|นางสาว|นาง|ด\.ช\.|ด\.ญ\.)\s*/g, '');
        const reId = reStudentMap[String(s.student_id || '').trim()] ||
                     reStudentMap[cleanName] ||
                     reStudentMap[strippedName] ||
                     String(s.id || '').trim();

        const passedCentralSet = centralAttMap[String(reId)] || centralAttMap[String(s.id)] || centralAttMap[String(s.student_id)] || new Set();
        const centralPresent = isGraduated ? totalCentralActs : Math.min(passedCentralSet.size, totalCentralActs);
        const centralPercent = isGraduated ? 100 : (totalCentralActs > 0 ? Math.min(100, Math.round((centralPresent / totalCentralActs) * 100)) : 100);
        const isScout = Boolean(s.pure_level && s.pure_level.includes('ปวช.1'));

        // Real Club Activities Data (เชื่อมโยงตามแผนกและระดับชั้น)
        const normDept = normalizeDepartmentName(s.department);
        const sLvl = String(s.pure_level || '').trim();
        const sId = String(s.id || s.student_id).trim();
        const roomClubSessions = clubSessions.filter(cs => {
          const matchDept = cs.normDept === normDept || cs.normDept.includes(normDept) || normDept.includes(cs.normDept);
          const matchLvl = !cs.cLvl || cs.cLvl === sLvl || sLvl.includes(cs.cLvl) || cs.cLvl.includes(sLvl);
          return matchDept && matchLvl;
        });
        const clubTotal = roomClubSessions.length;
        const clubAttendedCount = roomClubSessions.filter(cs => {
          if (Array.isArray(cs.presentStudentIds) && cs.presentStudentIds.length > 0) {
            return cs.presentStudentIds.includes(sId) || cs.presentStudentIds.includes(String(s.student_id).trim());
          }
          return true;
        }).length;
        const clubPresent = isGraduated ? clubTotal : clubAttendedCount;
        const clubPercent = isGraduated ? 100 : (clubTotal > 0 ? Math.min(100, Math.round((clubPresent / clubTotal) * 100)) : 100);

        return {
          id: s.id,
          student_id: s.student_id,
          name: s.student_name || '',
          dept: normalizeDepartmentName(s.department),
          level: s.pure_level || 'ไม่ระบุ',
          teacher: s.teacher_email || '-',
          present,
          total,
          totalTermDays: daysStats.totalTermDays,
          rawPresent,
          rawTotal,
          percent: pct,
          isGraduated,
          isNotStarted: isTermNotStarted,
          centralPresent,
          centralTotal: totalCentralActs,
          centralPercent,
          centralPassed: centralPercent >= 80,
          attendedActivityIds: Array.from(passedCentralSet),
          isScout,
          clubPresent,
          clubTotal,
          clubPercent,
          clubPassed: clubPercent >= 80,
          passCount: isGraduated ? 3 : isTermNotStarted ? 3 : (
            (pct >= 80 ? 1 : 0) +
            ((totalCentralActs === 0 || centralPercent >= 80) ? 1 : 0) +
            ((clubTotal === 0 || clubPercent >= 80) ? 1 : 0)
          ),
          photoUrl: studentPhotosMap[s.id] || studentPhotosMap[s.student_id] || studentPhotosMap[s.student_name] || studentPhotosMap[s.name] || null,
          _inherited: s._inherited || false
        };
      });
      mapped.sort((a, b) => {
        if (a.isGraduated !== b.isGraduated) return a.isGraduated ? 1 : -1;
        if (a.isNotStarted !== b.isNotStarted) return a.isNotStarted ? 1 : -1;
        // เรียงจากเลข 0/3, 1/3, 2/3, 3/3 ตามลำดับ
        if (a.passCount !== b.passCount) return a.passCount - b.passCount;
        if (a.percent !== b.percent) return a.percent - b.percent;
        if (a.present !== b.present) return a.present - b.present;
        return (a.name || '').localeCompare(b.name || '', 'th');
      });
      setMasterStudents(mapped);
      try {
        localStorage.setItem('app_cached_students', JSON.stringify(mapped));
      } catch(_) {}
    } catch (err) {
      console.error(err);
      alert('ไม่สามารถดึงข้อมูลเข้าแถวได้: ' + err.message);
    } finally {
      setIsLoading(false);
    }
  }, [currentAcademicYear, currentSemester, loggedInTeacher, dashboardViewMode, teachersList]);

  const handleCalendarSettingsUpdated = useCallback(async (updates) => {

  const handleSaveHolidayReason = useCallback(async (dateStr, reason) => {

  // Fetch Activities Data (เทอม 1 ใช้ ReCheck เดิม / เทอม 2 ขึ้นไปซิงก์นักเรียนจาก attendance_summary ก้อนเดียวกัน 100%)
  const fetchActivitiesData = useCallback(async () => {
    setIsLoading(true);
    try {
      const activeYear = currentAcademicYear || '2569';
      const activeSem = currentSemester || '1';

      // 1. เทอม 1/2569 (เทอมเดียวเท่านั้น): ให้ดึง ReCheck เดิม ไม่แตะต้องประวัติเก่า
      if (String(activeYear) === '2569' && String(activeSem) === '1') {
        const client = dbReCheckFallback;
        const [recheckStudents, recheckActs, recheckAtts] = await Promise.all([
          fetchAllRows(client, 'students', '*').catch(() => []),
          fetchAllRows(client, 'activities', '*').catch(() => []),
          fetchAllRows(client, 'attendances', '*').catch(() => [])
        ]);

        const totalActs = (recheckActs || []).length;
        setActivities(prev => JSON.stringify(prev) === JSON.stringify(recheckActs) ? prev : (recheckActs || []));

        const attMap = {};
        (recheckAtts || []).forEach(a => {
          const sid = String(a.student_id || '').trim();
          const actId = String(a.activity_id || '').trim().toLowerCase();
          if (sid && actId) {
            if (!attMap[sid]) attMap[sid] = new Set();
            attMap[sid].add(actId);
          }
        });

        const mapped = (recheckStudents || []).map(s => {
          const passedSet = new Set();
          const idStr = String(s.id || '').trim();
          const codeStr = String(s.student_id || '').trim();
          if (idStr && attMap[idStr]) attMap[idStr].forEach(act => passedSet.add(act));
          if (codeStr && attMap[codeStr]) attMap[codeStr].forEach(act => passedSet.add(act));
          const passedCount = Math.min(passedSet.size, totalActs);
          const pct = totalActs > 0 ? Math.min(Math.round((passedCount / totalActs) * 100), 100) : 0;
          return {
            id: s.id,
            student_id: s.student_id,
            name: s.full_name || '',
            dept: normalizeDepartmentName(s.department),
            level: s.class_level || 'ไม่ระบุ',
            teacher: `ผ่าน ${passedCount}/${totalActs} งาน`,
            present: passedCount,
            total: totalActs,
            rawPresent: passedCount,
            rawTotal: totalActs,
            percent: pct,
            centralPresent: passedCount,
            centralTotal: totalActs,
            centralPercent: pct,
            centralPassed: pct >= 80,
            isScout: Boolean(s.class_level && s.class_level.includes('ปวช.1')),
            clubPresent: 0,
            clubTotal: 0,
            clubPercent: 0,
            clubPassed: false,
            passedSet
          };
        });

        mapped.sort((a, b) => (a.percent !== b.percent ? a.percent - b.percent : (a.name || '').localeCompare(b.name || '', 'th')));
        setMasterStudents(mapped);
        setLastUpdated(`กิจกรรมกลาง: ${totalActs} กิจกรรม (เทอม 1 เดิม)`);
        setIsLoading(false);
        return;
      }

      // 2. ตั้งแต่เทอม 2/2569 เป็นต้นไป และทุกปีในอนาคต: ดึงนักเรียนจาก attendance_summary ก้อนเดียวกับเข้าแถว
      const client = dbAssembly;
      const [summaryStudents, activitiesRaw, attendancesRaw] = await Promise.all([
        fetchAllRows(client, 'attendance_summary', '*').catch(() => []),
        fetchAllRows(client, 'activities', '*').catch(() => []),
        fetchAllRows(client, 'attendances', '*').catch(() => [])
      ]);

      // ดึงรายชื่อนักเรียนของเทอมนั้น (รองรับการสืบทอดรายชื่อจากเทอม 1 เหมือนหน้าเข้าแถวเป๊ะ)
      let termStudents = [];
      const semExplicit = (summaryStudents || []).filter(s => 
        String(s.academic_year) === String(activeYear) && String(s.semester) === String(activeSem)
      );

      if (String(activeSem) === '2') {
        const semNames = new Set(semExplicit.map(s => (s.student_name || '').trim()));
        const sem1Base = (summaryStudents || []).filter(s => 
          (String(s.academic_year) === String(activeYear) || !s.academic_year) && 
          String(s.semester || '1') === '1'
        );
        const inherited = sem1Base
          .filter(s => !semNames.has((s.student_name || '').trim()))
          .map(s => ({
            ...s,
            academic_year: activeYear,
            semester: activeSem,
            _inherited: true
          }));
        termStudents = [...semExplicit, ...inherited];
      } else {
        termStudents = semExplicit;
      }

      // กรองกิจกรรมกลางเฉพาะของปีและเทอมนี้
      const termActs = (activitiesRaw || []).filter(a => 
        String(a.academic_year || activeYear) === String(activeYear) && 
        String(a.semester || activeSem) === String(activeSem)
      );
      const totalActs = termActs.length;
      setActivities(prev => JSON.stringify(prev) === JSON.stringify(termActs) ? prev : termActs);

      const attMap = {};
      const termActIdSet = new Set(termActs.map(a => String(a.id || '').trim().toLowerCase()));
      (attendancesRaw || []).forEach(a => {
        const sid = String(a.student_id || '').trim();
        const actId = String(a.activity_id || '').trim().toLowerCase();
        if (sid && actId && termActIdSet.has(actId)) {
          if (!attMap[sid]) attMap[sid] = new Set();
          attMap[sid].add(actId);
        }
      });

      // นำนักเรียนทุกคนเข้าตารางกิจกรรม (แม้มี 0 กิจกรรม รายชื่อทุกคนก็แสดงครบ 100%)
      const mapped = termStudents.map(s => {
        const passedSet = new Set();
        const idStr = String(s.id || '').trim();
        const codeStr = String(s.student_id || '').trim();
        const nameStr = String(s.student_name || '').trim();

        if (idStr && attMap[idStr]) attMap[idStr].forEach(act => passedSet.add(act));
        if (codeStr && attMap[codeStr]) attMap[codeStr].forEach(act => passedSet.add(act));
        if (nameStr && attMap[nameStr]) attMap[nameStr].forEach(act => passedSet.add(act));

        const isGraduated = s.pure_level === 'สำเร็จการศึกษา';
        const passedCount = totalActs > 0 ? Math.min(passedSet.size, totalActs) : 0;
        const pct = isGraduated ? 100 : (totalActs > 0 ? Math.min(Math.round((passedCount / totalActs) * 100), 100) : 0);

        return {
          id: s.id,
          student_id: s.student_id,
          name: s.student_name || '',
          dept: normalizeDepartmentName(s.department),
          level: s.pure_level || 'ไม่ระบุ',
          teacher: totalActs > 0 ? `ผ่าน ${passedCount}/${totalActs} งาน` : 'รอเปิดกิจกรรมกลาง',
          present: passedCount,
          total: totalActs,
          rawPresent: passedCount,
          rawTotal: totalActs,
          percent: pct,
          centralPresent: passedCount,
          centralTotal: totalActs,
          centralPercent: pct,
          centralPassed: pct >= 80,
          isScout: Boolean(s.pure_level && s.pure_level.includes('ปวช.1')),
          clubPresent: 0,
          clubTotal: 0,
          clubPercent: 0,
          clubPassed: false,
          isGraduated,
          passedSet
        };
      });

      mapped.sort((a, b) => {
        if (a.isGraduated !== b.isGraduated) return a.isGraduated ? 1 : -1;
        if (a.passCount !== undefined && b.passCount !== undefined && a.passCount !== b.passCount) {
          return a.passCount - b.passCount;
        }
        if (a.percent !== b.percent) return a.percent - b.percent;
        return (a.name || '').localeCompare(b.name || '', 'th');
      });

      setMasterStudents(mapped);
      setLastUpdated(totalActs > 0 
        ? `กิจกรรมกลาง: ${totalActs} กิจกรรม (ภาคเรียนที่ ${activeSem}/${activeYear})` 
        : `กิจกรรมกลาง: ยังไม่มีกิจกรรมในภาคเรียนที่ ${activeSem}/${activeYear} (นักเรียน ${mapped.length} คน)`);
    } catch (err) {
      console.error(err);
      alert('ไม่สามารถดึงข้อมูลกิจกรรมได้: ' + err.message);
    } finally {
      setIsLoading(false);
    }
  }, [currentAcademicYear, currentSemester]);

  const reloadData = useCallback(() => {
    setIsLoading(true);
    if (systemMode === 'assembly') fetchAssemblyData();
    else if (systemMode === 'activities') fetchActivitiesData();
    else fetchAssemblyData();
    fetchTeachers();
    fetchSessions();
  }, [systemMode, fetchAssemblyData, fetchActivitiesData, fetchTeachers, fetchSessions]);

  useEffect(() => {
    reloadData();
  }, [systemMode]);

    const yr = (newYearInput || prompt('กรุณากรอกปีการศึกษา พ.ศ. ใหม่ (เช่น 2570, 2571):') || '').trim();

        p_settings: [
          { key: 'current_academic_year', value: yr },
          { key: 'available_academic_years', value: JSON.stringify(updatedYears) }

    alert(`เพิ่มและสลับไปยังปีการศึกษา ${yr} เรียบร้อยแล้ว`);

  const handleSaveHiddenClassLevels = useCallback(async (levelsList) => {

    setHiddenClassLevels(list);
    try {
      const token = sessionStorage.getItem('admin_session_token') || 'admin2026';
      await dbAssembly.rpc('admin_save_system_setting_secure', {

  const isAssembly = systemMode === 'assembly';
  const isActivities = systemMode === 'activities';
  const isClub = systemMode === 'club';

  // Central Activity Active Status Computation (สอดคล้องกับสวิตช์เปิด/ปิดรายกิจกรรมของผู้ดูแลระบบส่วนกลาง)
  const activeCentralActivities = useMemo(() => {

  }, [activities, openCentralActivityIds]);

  const activeCentralActivity = activeCentralActivities[0] || null;

  const activeClubSessions = useMemo(() => {
    return (clubSessionsConfig || []).filter(s => Boolean(s.is_open));
  }, [clubSessionsConfig]);

  const activeClubSession = activeClubSessions[0] || null;

  // Sandbox (Test Mode) Filtered Records
  const isTeacherTesting = Boolean(isSandboxMode && loggedInTeacher && (
    normalizeDepartmentName(loggedInTeacher.department || '') === 'ทดสอบระบบ' || 
    (loggedInTeacher.name || '').includes('ทดสอบ') ||
    (loggedInTeacher.name || '').toLowerCase() === 'admin'
  ));

  const displayTeachers = useMemo(() => {
    if (isSandboxMode || isTeacherTesting) return teachersList;
    return (teachersList || []).filter(t => {
      const d = normalizeDepartmentName(t.department || '');

    });

  const displayDailyAttendance = useMemo(() => {

    return (dailyAttendanceRecords || []).filter(r => {
      const d = normalizeDepartmentName(r.department || '');
      return d !== 'ทดสอบระบบ';

  const displayCheckinSessions = useMemo(() => {
    if (isSandboxMode || isTeacherTesting) return checkinSessions;
    return (checkinSessions || []).filter(s => {
      const d = normalizeDepartmentName(s.department || '');
      const t = (s.teacher_name || '').toLowerCase();
      return d !== 'ทดสอบระบบ' && !t.includes('ทดสอบ') && t !== 'admin';
    });
  }, [checkinSessions, isSandboxMode, isTeacherTesting]);

  // Master Students with sandbox mock students completely filtered out when sandbox mode is OFF
  const displayMasterStudents = useMemo(() => {
    let list = masterStudents || [];
    if (!isSandboxMode && !isTeacherTesting) {
      list = list.filter(s => {
        const d = normalizeDepartmentName(s.dept || s.department || '');
        const sid = Number(s.id || s.student_id || 0);
        const name = s.name || s.student_name || '';
        return d !== 'ทดสอบระบบ' && !(sid >= 99000 && sid < 100000) && !name.includes('ทดสอบ');
      });
    }
    return list;
  }, [masterStudents, isSandboxMode, isTeacherTesting]);

  // Active Master Students (Excludes hidden class levels and sandbox mock students when mode is OFF)
  const activeMasterStudents = useMemo(() => {
    if (!hiddenClassLevels || hiddenClassLevels.length === 0) return displayMasterStudents;
    return displayMasterStudents.filter(s => {
      const lvl = String(s.level || s.class_level || s.pure_level || '').trim();
      return !hiddenClassLevels.includes(lvl);
    });
  }, [displayMasterStudents, hiddenClassLevels]);

  // Sibling rooms managed by logged in teacher (Multi-room support)
  const loggedInTeacherRooms = useMemo(() => {
    if (!loggedInTeacher) return [];
    const targetNorm = normalizeTeacherName(loggedInTeacher.name);
    const list = (teachersList || []).filter(t => normalizeTeacherName(t.name) === targetNorm);
    if (!list.some(r => r.id === loggedInTeacher.id)) {
      list.unshift(loggedInTeacher);
    }
    return list;
  }, [loggedInTeacher, teachersList]);

  // Students scoped to teacher's room(s)
  const teacherScopedStudents = useMemo(() => {
    if (!loggedInTeacher) return [];
    const roomsToMatch = (teacherSelectedRoomId === 'ALL')
      ? loggedInTeacherRooms
      : loggedInTeacherRooms.filter(r => r.id === teacherSelectedRoomId);
    
    if (roomsToMatch.length === 0) return [];

    const sLvl = String(s.class_level || s.level || s.pure_level || '').trim();
    const rawId = String(s.student_id || s.id || '').replace(/\D/g, '');
    return sDept === normDept && sLvl === classLvl && rawId.length >= 8;
